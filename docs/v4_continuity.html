<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OniChase V4 Track Continuity Audit</title>
  <style>
    :root {
      --bg: #eef4f6;
      --panel: rgba(255, 255, 255, 0.94);
      --ink: #172333;
      --muted: #64748b;
      --line: #d4dde6;
      --accent: #0f766e;
      --shadow: 0 20px 48px rgba(23, 35, 51, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 16%, rgba(15, 118, 110, 0.13), transparent 24%),
        linear-gradient(180deg, #f9fbfc 0%, var(--bg) 100%);
    }

    .page {
      min-height: 100vh;
      padding: 24px;
      display: grid;
      gap: 18px;
    }

    .top {
      border: 1px solid rgba(212, 221, 230, 0.92);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0.04em;
    }

    p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    a {
      color: var(--accent);
      font-weight: 850;
      text-decoration: none;
    }

    .links a {
      border: 1px solid rgba(212, 221, 230, 0.95);
      border-radius: 999px;
      padding: 9px 13px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 8px 18px rgba(23, 35, 51, 0.06);
    }

    .figure {
      border: 1px solid rgba(212, 221, 230, 0.92);
      border-radius: 24px;
      background: #ffffff;
      box-shadow: var(--shadow);
      overflow: auto;
    }

    .figure img {
      display: block;
      width: min(1800px, 100%);
      height: auto;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div>
        <h1>V4 Track Continuity Audit</h1>
        <p>All 12 multi-component operator-line pairs are highlighted on one map. Gray lines show the nationwide railway overview.</p>
      </div>
      <nav class="links" aria-label="Audit links">
        <a href="./v4.html">Back to V4 Map</a>
        <a href="./data/v4_track_continuity_highlights.svg">Open SVG</a>
        <a href="./data/v4_maplibre/track_continuity_highlights.geojson">Open GeoJSON</a>
      </nav>
    </header>
    <section class="figure">
      <img src="./data/v4_track_continuity_highlights.svg" alt="Map highlighting 12 v4 track continuity warning lines" />
    </section>
  </main>
</body>
</html>
