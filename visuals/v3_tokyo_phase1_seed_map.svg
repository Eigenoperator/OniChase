<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#93a4bf" flood-opacity="0.16" />
    </filter>
  </defs>
  <style>
    .bg { fill: #f6f8fb; }
    .panel { fill: rgba(255,255,255,0.88); stroke: #d5deea; stroke-width: 1.2; }
    .title { font: 700 28px 'Noto Sans', 'Segoe UI', sans-serif; fill: #182534; }
    .subtitle { font: 500 14px 'Noto Sans', 'Segoe UI', sans-serif; fill: #5c6c80; }
    .station { fill: #ffffff; stroke: #17324d; stroke-width: 2; }
    .station-ja { font: 700 17px 'Noto Sans JP', 'Segoe UI', sans-serif; fill: #13283f; }
    .station-en { font: 500 12px 'Noto Sans', 'Segoe UI', sans-serif; fill: #56677d; }
    .legend { font: 600 14px 'Noto Sans', 'Segoe UI', sans-serif; fill: #274058; }
  </style>
  <rect class="bg" x="0" y="0" width="1400" height="900" />
  <rect class="panel" x="36" y="28" width="1328" height="844" rx="24" filter="url(#shadow)" />
  <text x="72" y="88" class="title">V3 Tokyo Phase 1 Seed Map</text>
  <text x="72" y="115" class="subtitle">Current Tokyo Shinkansen core seed using real station positions. This is the first step, not the final v3 rail scope.</text>

  <g>
    <path d="M 1009.44,488.19 L 1058.56,439.17 L 371.53,147.66" fill="none" stroke="#2d9c5b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" /><path d="M 1009.44,488.19 L 1058.56,439.17 L 371.53,147.66" fill="none" stroke="#f09b20" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" /><path d="M 1009.44,488.19 L 1058.56,439.17 L 371.53,147.66" fill="none" stroke="#d54a96" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" /><path d="M 1009.44,488.19 L 1058.56,439.17 L 371.53,147.66" fill="none" stroke="#e65045" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" /><path d="M 1009.44,488.19 L 1058.56,439.17 L 371.53,147.66" fill="none" stroke="#2c62c9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" /><path d="M 1009.44,488.19 L 887.72,567.83 L 341.44,752.34" fill="none" stroke="#1f4fb9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" />
  </g>
  <g>
    
            <g>
              <circle cx="1009.44" cy="488.19" r="7" class="station" />
              <text x="1021.44" y="478.19" class="station-ja">東京</text>
              <text x="1021.44" y="498.19" class="station-en">Tokyo</text>
            </g>
            
            <g>
              <circle cx="1058.56" cy="439.17" r="7" class="station" />
              <text x="1070.56" y="429.17" class="station-ja">上野</text>
              <text x="1070.56" y="449.17" class="station-en">Ueno</text>
            </g>
            
            <g>
              <circle cx="371.53" cy="147.66" r="7" class="station" />
              <text x="383.53" y="137.66" class="station-ja">大宮</text>
              <text x="383.53" y="157.66" class="station-en">Omiya</text>
            </g>
            
            <g>
              <circle cx="887.72" cy="567.83" r="7" class="station" />
              <text x="899.72" y="557.83" class="station-ja">品川</text>
              <text x="899.72" y="577.83" class="station-en">Shinagawa</text>
            </g>
            
            <g>
              <circle cx="341.44" cy="752.34" r="7" class="station" />
              <text x="353.44" y="742.34" class="station-ja">新横浜</text>
              <text x="353.44" y="762.34" class="station-en">Shin-Yokohama</text>
            </g>
            
  </g>

  <g transform="translate(1090, 104)">
    <text x="0" y="0" class="title" style="font-size:20px;">Current Routes</text>
    <g transform="translate(0,28)">
      
            <g transform="translate(0,0)">
              <line x1="0" y1="0" x2="22" y2="0" stroke="#2d9c5b" stroke-width="6" stroke-linecap="round" />
              <text x="32" y="5" class="legend">Tohoku / Hokkaido</text>
            </g>
            
            <g transform="translate(0,52)">
              <line x1="0" y1="0" x2="22" y2="0" stroke="#f09b20" stroke-width="6" stroke-linecap="round" />
              <text x="32" y="5" class="legend">Yamagata</text>
            </g>
            
            <g transform="translate(0,78)">
              <line x1="0" y1="0" x2="22" y2="0" stroke="#d54a96" stroke-width="6" stroke-linecap="round" />
              <text x="32" y="5" class="legend">Akita</text>
            </g>
            
            <g transform="translate(0,104)">
              <line x1="0" y1="0" x2="22" y2="0" stroke="#e65045" stroke-width="6" stroke-linecap="round" />
              <text x="32" y="5" class="legend">Joetsu</text>
            </g>
            
            <g transform="translate(0,130)">
              <line x1="0" y1="0" x2="22" y2="0" stroke="#2c62c9" stroke-width="6" stroke-linecap="round" />
              <text x="32" y="5" class="legend">Hokuriku</text>
            </g>
            
            <g transform="translate(0,156)">
              <line x1="0" y1="0" x2="22" y2="0" stroke="#1f4fb9" stroke-width="6" stroke-linecap="round" />
              <text x="32" y="5" class="legend">Tokaido</text>
            </g>
            
    </g>
  </g>
</svg>
