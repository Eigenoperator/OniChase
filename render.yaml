services:
  - type: web
    name: onichase-v2-room-server
    runtime: python
    plan: free
    rootDir: .
    autoDeployTrigger: off
    buildCommand: ""
    startCommand: bash -lc "python3 scripts/engine/v2_online_room_server.py --dataset shinkansen --host 0.0.0.0 --port ${PORT:-8765}"
  - type: web
    name: onichase-v3-room-server
    runtime: python
    plan: free
    rootDir: .
    autoDeployTrigger: off
    buildCommand: ""
    startCommand: bash -lc "python3 scripts/engine/v2_online_room_server.py --dataset v3-tokyo --host 0.0.0.0 --port ${PORT:-8765}"
  - type: web
    name: onichase-v4-room-server
    runtime: python
    plan: free
    rootDir: .
    autoDeployTrigger: off
    buildCommand: ""
    startCommand: bash -lc "python3 scripts/engine/v2_online_room_server.py --dataset v4-nationwide --host 0.0.0.0 --port ${PORT:-8765}"
