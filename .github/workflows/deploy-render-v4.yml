name: Deploy Render V4 Room Server

on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip render]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_V4_DEPLOY_HOOK_URL: ${{ secrets.RENDER_V4_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_V4_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_V4_DEPLOY_HOOK_URL is not configured; skipping optional Render v4 room-server deploy."
            echo "GitHub Pages static deployment is handled by deploy-pages.yml."
            echo "Create a Render Deploy Hook for onichase-v4-room-server and save it as this repository secret to enable this job."
            exit 0
          fi
          curl --fail --show-error --silent --request POST "$RENDER_V4_DEPLOY_HOOK_URL"
          echo "Triggered Render v4 room server deploy."
